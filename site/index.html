<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM Maths Question Generator</title>
<meta name="description" content="Generate SPM Mathematics practice questions and answers for Form 1 to Form 5, in English or Bahasa Melayu. Print-ready worksheets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  /* apply saved theme before first paint to avoid a flash */
  try { var t = JSON.parse(localStorage.getItem('spm-gen-v1') || '{}').theme; if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  /* preload KaTeX's main font so it doesn't wait for the first render; skipped on file://, where Chrome blocks the CORS-mode font fetch */
  if (location.protocol !== 'file:') {
    var pl = document.createElement('link');
    pl.rel = 'preload'; pl.as = 'font'; pl.type = 'font/woff2'; pl.crossOrigin = 'anonymous';
    pl.href = 'vendor/katex/fonts/KaTeX_Main-Regular.woff2';
    document.head.appendChild(pl);
  }
</script>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#sheet" data-i18n="skip">Skip to worksheet</a>

<header class="app-header">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M9 16h14M16 9v14" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round"/></svg>
    </span>
    <div>
      <h1 data-i18n="title">SPM Maths Question Generator</h1>
      <p class="tag" data-i18n="subtitle">Form 1 – Form 5 · practice questions with answers</p>
    </div>
  </div>
  <div class="header-tools">
    <div class="seg" role="group" aria-label="Interface language" id="ui-lang">
      <button type="button" data-val="en" title="Interface language: English">EN</button>
      <button type="button" data-val="ms" title="Bahasa antara muka: Bahasa Melayu">BM</button>
    </div>
    <button type="button" class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Light / dark">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" aria-labelledby="topics-h">
    <div class="side-head">
      <h2 id="topics-h" data-i18n="topics">Topics</h2>
      <span class="count" id="sel-count" aria-live="polite"></span>
    </div>
    <input type="search" id="filter" class="search" data-i18n-ph="search" placeholder="Search chapters…" autocomplete="off">
    <div class="side-actions">
      <button type="button" class="link-btn" id="expand-all" data-i18n="expandAll">Expand all</button>
      <button type="button" class="link-btn" id="collapse-all" data-i18n="collapseAll">Collapse all</button>
      <button type="button" class="link-btn" id="clear-all" data-i18n="clearAll">Clear selection</button>
    </div>
    <div id="tree" class="tree"></div>
  </aside>

  <main class="main">
    <section class="options" aria-label="Options">
      <div class="opt">
        <label for="count" data-i18n="count">Number of questions</label>
        <div class="count-row">
          <input type="number" id="count" min="1" max="100" value="10" inputmode="numeric">
          <div class="chips" id="count-presets" role="group"></div>
        </div>
      </div>

      <div class="opt">
        <span class="lbl" id="diff-l" data-i18n="difficulty">Difficulty</span>
        <div class="seg wide" role="group" aria-labelledby="diff-l" id="difficulty">
          <button type="button" data-val="e" data-i18n="easy">Easy</button>
          <button type="button" data-val="m" data-i18n="medium">Medium</button>
          <button type="button" data-val="a" data-i18n="advanced">Advanced</button>
          <button type="button" data-val="mixed" data-i18n="mixed">Mixed</button>
        </div>
      </div>

      <div class="opt qlang">
        <span class="lbl" id="qlang-l" data-i18n="qlang">Question language</span>
        <div class="seg" role="group" aria-labelledby="qlang-l" id="qlang">
          <button type="button" data-val="en">English</button>
          <button type="button" data-val="ms">Bahasa Melayu</button>
        </div>
      </div>

      <div class="opt">
        <span class="lbl" id="fmt-l" data-i18n="format">Format</span>
        <div class="seg" role="group" aria-labelledby="fmt-l" id="format">
          <button type="button" data-val="normal" data-i18n="normal">Normal</button>
          <button type="button" data-val="compact" data-i18n="compact">Compact</button>
        </div>
        <p class="hint" id="fmt-hint"></p>
      </div>

      <div class="opt more" role="group" aria-labelledby="more-l">
        <span class="lbl" id="more-l" data-i18n="more">More options</span>
        <div class="more-grid">
          <label class="check"><input type="checkbox" id="opt-header" checked> <span data-i18n="optHeader">Name / class / date line</span></label>
          <label class="check"><input type="checkbox" id="opt-labels" checked> <span data-i18n="optLabels">Show difficulty label on each question</span></label>
          <label class="check" id="cols-wrap"><input type="checkbox" id="opt-cols"> <span data-i18n="optCols">Two columns (compact only)</span></label>
          <label class="check"><input type="checkbox" id="opt-working"> <span data-i18n="optWorking">Show working steps in the answers</span></label>
          <label class="seed"><span data-i18n="seed">Seed</span> <input type="text" id="seed" inputmode="numeric" size="10" spellcheck="false" autocomplete="off"></label>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="new-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <span data-i18n="generate">New questions</span>
        </button>
        <button type="button" class="btn" id="print-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/></svg>
          <span data-i18n="print">Print / Save as PDF</span>
        </button>
      </div>
      <p class="hint" data-i18n="printHint">In the print dialog, choose “Save as PDF” to download a file. The answers are always on their own last page.</p>
    </section>

    <article id="sheet" class="sheet" aria-live="polite"></article>
  </main>
</div>

<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/svg.js"></script>
<script defer src="js/figs.js"></script>
<script defer src="js/vary.js"></script>
<!--DATA-->
<script defer src="js/data/f1a.js"></script>
<script defer src="js/data/f1b.js"></script>
<script defer src="js/data/f1c.js"></script>
<script defer src="js/data/f1d.js"></script>
<script defer src="js/data/f2a.js"></script>
<script defer src="js/data/f2b.js"></script>
<script defer src="js/data/f2c.js"></script>
<script defer src="js/data/f2d.js"></script>
<script defer src="js/data/f3a.js"></script>
<script defer src="js/data/f3b.js"></script>
<script defer src="js/data/f4a.js"></script>
<script defer src="js/data/f4b.js"></script>
<script defer src="js/data/f4c.js"></script>
<script defer src="js/data/f5a.js"></script>
<script defer src="js/data/f5b.js"></script>
<!--/DATA-->
<!-- the x*.js "variety pack" generators (several MB together) are loaded lazily by js/packs.js, after this
     point, so the page paints and the topic picker works immediately from the (much smaller) files above -->
<script defer src="js/pack-manifest.js"></script>
<script defer src="js/packs.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
